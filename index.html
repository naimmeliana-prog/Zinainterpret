<!doctype html>
<html lang="es" dir="ltr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cabina — Estudio de Interpretación de Conferencias</title>
    <meta
      name="description"
      content="Plataforma gratuita y de código abierto para la formación progresiva en interpretación simultánea y consecutiva (ES, FR, AR), con ejercicios de audio, toma de notas con símbolos, análisis de voz con IA y cifrado local AES-GCM."
    />
    <meta property="og:title" content="Cabina — Estudio de Interpretación de Conferencias" />
    <meta
      property="og:description"
      content="Formación progresiva y visual en interpretación simultánea y consecutiva en Español, Francés y Árabe con repositorios ONU/UE, grabación comparativa y análisis de voz con IA."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0B0F17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cabina" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('cabina_theme_pref') || 'dark';
          var isDark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) root.classList.add('dark');
          else root.classList.remove('dark');

          var uiLang = localStorage.getItem('cabina_ui_lang');
          if (uiLang === 'ar' || uiLang === 'fr' || uiLang === 'es') {
            root.lang = uiLang;
            root.dir = uiLang === 'ar' ? 'rtl' : 'ltr';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#0B0F17] dark:text-slate-100 antialiased selection:bg-sky-500/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
